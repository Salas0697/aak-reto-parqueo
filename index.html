<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#00264e">
<meta name="description" content="Reto de parqueo CON-VIVE mejor | AAK">
<title>Reto de parqueo CON-VIVE mejor | AAK</title>
<style>html,body{margin:0;width:100%;height:100%;background:#00264e;font-family:Arial,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;color:white;text-align:center;padding:24px}#load b{display:block;font-size:22px;margin-bottom:8px}#load span{font-size:13px;color:#d5e5f5}</style>
</head>
<body>
<div id="load"><div><b>CON-VIVE mejor</b><span>Preparando tu reto de parqueo...</span></div></div>
<script>
Promise.all(['v2a.txt','v2b.txt','v2c.txt'].map(f=>fetch(f+'?v=18',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})))
.then(parts=>{
  let game=parts.join('');
  /* Hotfix: the V2 car was initially outside its collision bounds, so the first pedal press immediately stopped it. */
  game=game.replace('translate(222 294) rotate(168)','translate(222 276) rotate(168)')
           .replace('let x=222,y=294,heading=168,','let x=222,y=276,heading=168,')
           .replace('x=222;y=294;heading=168;','x=222;y=276;heading=168;')
           .replace(/cache:'force-cache'/g,"cache:'no-store'")
           .replace(/tip-1\.txt/g,'tip-1.txt?v=18')
           .replace(/tip-4\.txt/g,'tip-4.txt?v=18');
  document.open();document.write(game);document.close();
})
.catch(()=>{document.getElementById('load').innerHTML='<div><b>No pudimos cargar el reto</b><span>Actualiza la página para intentarlo nuevamente.</span></div>'});
</script>
</body>
</html>
